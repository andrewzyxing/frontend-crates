<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="native-audio-ownership-title native-audio-ownership-desc" id="native-audio-ownership-root">
<title id="native-audio-ownership-title">Native Rust audio repository boundaries</title>
<desc id="native-audio-ownership-desc">SGLang handles audio requests and scheduler integration while frontend-crates decodes and processes PCM, with a future SHM importer feeding the same processor.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #native-audio-ownership-root { color: #2d3142; font-family: Geist,system-ui,sans-serif; }
      #native-audio-ownership-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#native-audio-ownership-root .diagram-container { overflow-x:visible }
}</style><marker id="native-audio-ownership-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#4f5d75"/></marker></defs>
<rect width="1280" height="720" fill="#f5f5f5"/>
<text x="40" y="60" fill="#2d3142" font-family="Instrument Serif, Georgia, serif" font-size="40" font-weight="400">Native Rust audio: repository boundaries</text>
<text x="40" y="96" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">PROPOSED CONTRIBUTION · ordinary audio first · PCM SHM is a separate follow-up</text>
<rect x="32" y="144" width="304" height="420" rx="8" fill="#eeeeef" stroke="#5a6580" stroke-width="1.2" />
<text x="48" y="172" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">SGLANG · REQUEST / IMPORT</text>
<rect x="368" y="144" width="512" height="420" rx="8" fill="#eeeeef" stroke="#5a6580" stroke-width="1.2" />
<text x="384" y="172" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">FRONTEND-CRATES · SHARED RUST LIBRARY</text>
<rect x="912" y="144" width="336" height="420" rx="8" fill="#eeeeef" stroke="#5a6580" stroke-width="1.2" />
<text x="928" y="172" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">SGLANG · SCHEDULER / EXECUTION</text>
<path d="M312 276 H400" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#native-audio-ownership-arrow)"/>
<path d="M508 328 V376 Q508 384 516 384 H744 Q752 384 752 392 V424" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#native-audio-ownership-arrow)"/>
<path d="M312 480 H648" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#native-audio-ownership-arrow)" stroke-dasharray="5 4"/>
<path d="M856 480 H936" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#native-audio-ownership-arrow)"/>
<path d="M1072 424 V328" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#native-audio-ownership-arrow)"/>
<rect x="336" y="248" width="56" height="20" fill="#f5f5f5"/>
<text x="340" y="262" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">BYTES</text>
<rect x="588" y="356" width="48" height="20" fill="#f5f5f5"/>
<text x="592" y="370" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">PCM</text>
<rect x="468" y="452" width="48" height="20" fill="#f5f5f5"/>
<text x="472" y="466" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">PCM</text>
<rect x="864" y="452" width="68" height="20" fill="#f5f5f5"/>
<text x="868" y="466" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">TENSORS</text>
<rect x="1088" y="364" width="84" height="20" fill="#f5f5f5"/>
<text x="1092" y="378" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">HANDOFF</text>
<g data-node-id="api" data-parent="input">
<rect x="56" y="224" width="256" height="104" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2" />
<text x="68" y="242" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="8" font-weight="400">EXTEND</text>
<text x="68" y="266" fill="#2d3142" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="600">api.v1 audio input</text>
<text x="68" y="288" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">Request + byte fetching</text>
<text x="68" y="306" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">Native audio path to add</text>
</g>
<g data-node-id="shm" data-parent="input">
<rect x="56" y="424" width="256" height="112" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="68" y="442" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="8" font-weight="400">FOLLOW-UP</text>
<text x="68" y="466" fill="#2d3142" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="600">PCM SHM import</text>
<text x="68" y="488" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">PCM supplied by sidecar</text>
<text x="68" y="506" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">Validate + owned snapshot</text>
<text x="68" y="524" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">Independent read receipt</text>
</g>
<g data-node-id="decode" data-parent="crate">
<rect x="400" y="224" width="216" height="104" rx="6" fill="#fae9e2" stroke="#bf4520" stroke-width="1.2" />
<text x="412" y="242" fill="#bf4520" font-family="Geist Mono, ui-monospace, monospace" font-size="8" font-weight="400">PLANNED</text>
<text x="412" y="266" fill="#bf4520" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="600">Rust audio decode</text>
<text x="412" y="288" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">Encoded bytes to PCM</text>
<text x="412" y="306" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">Explicit PCM contract</text>
</g>
<g data-node-id="processor" data-parent="crate">
<rect x="648" y="424" width="208" height="112" rx="6" fill="#fae9e2" stroke="#bf4520" stroke-width="1.2" />
<text x="660" y="442" fill="#bf4520" font-family="Geist Mono, ui-monospace, monospace" font-size="8" font-weight="400">PLANNED</text>
<text x="660" y="466" fill="#bf4520" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="600">Audio processor</text>
<text x="660" y="488" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">Channels / sample rate</text>
<text x="660" y="506" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">Model features + metadata</text>
<text x="660" y="524" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">Token count + layout</text>
</g>
<g data-node-id="adapter" data-parent="output">
<rect x="936" y="424" width="272" height="112" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2" />
<text x="948" y="442" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="8" font-weight="400">EXTEND</text>
<text x="948" y="466" fill="#2d3142" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="600">Scheduler adapter</text>
<text x="948" y="488" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">Preserve audio modality</text>
<text x="948" y="506" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">Lengths / masks / spans</text>
<text x="948" y="524" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">Native result handoff</text>
</g>
<g data-node-id="model" data-parent="output">
<rect x="936" y="224" width="272" height="104" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2" />
<text x="948" y="242" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="8" font-weight="400">REUSE</text>
<text x="948" y="266" fill="#2d3142" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="600">Model execution</text>
<text x="948" y="288" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">Existing scheduler + runner</text>
<text x="948" y="306" fill="#4f5d75" font-family="Geist Mono, ui-monospace, monospace" font-size="12" font-weight="400">Audio E2E to validate</text>
</g>
<text x="40" y="600" fill="#4f5d75" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="400">The library runs inside SGLang. Columns show code ownership, not separate services.</text>
<text x="40" y="624" fill="#4f5d75" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="400">All native audio processing is proposed. First model / API TBD; align resolution and planning with #607.</text>
<text x="40" y="648" fill="#4f5d75" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="400">Future SHM receipt: source snapshot complete → producer may unlink; inference need not be complete.</text>
<line x1="40" y1="668" x2="1240" y2="668" stroke="#bfc0c0"/>
<text x="40" y="696" fill="#bf4520" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="400">ORANGE: shared Rust audio work</text>
<text x="424" y="696" fill="#4f5d75" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="400">DASHED: future PCM SHM path; not required by the audio draft</text>
</svg>
